{% extends "base.html" %}
{% block title %}Log in — Treasury Ledger{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h1>Treasury Ledger</h1>
    <p class="subtitle">Log in to your firm's account.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required style="width:100%">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required style="width:100%">
      </div>
      <button class="btn" type="submit" style="width:100%">Log in</button>
    </form>
    <p style="margin-top:16px;font-size:13px;color:var(--ink-soft)">
      No account yet? <a href="/register">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
