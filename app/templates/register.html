{% extends "base.html" %}
{% block title %}Create account — Treasury Ledger{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h1>Create your account</h1>
    <p class="subtitle">For CPA firms and advisors analyzing client 1099-DIVs.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
      <div class="field">
        <label for="firm_name">Firm / practice name (optional)</label>
        <input type="text" id="firm_name" name="firm_name" style="width:100%">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required style="width:100%">
      </div>
      <div class="field">
        <label for="password">Password (min. 8 characters)</label>
        <input type="password" id="password" name="password" required minlength="8" style="width:100%">
      </div>
      <button class="btn" type="submit" style="width:100%">Create account</button>
    </form>
    <p style="margin-top:16px;font-size:13px;color:var(--ink-soft)">
      Already have an account? <a href="/login">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
