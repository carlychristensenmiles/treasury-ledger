# Fly.io app config. Created by `fly launch` normally, but written by hand
# here so the repo is deploy-ready as-is -- see DEPLOY.md for the full
# walkthrough (app name, region, volume, and secrets all still need to be
# set up once per Fly account/app before the first `fly deploy`).

app = "treasury-ledger"          # must be globally unique on Fly -- change this if it's taken
primary_region = "iad"           # US East (Ashburn, VA); change to whatever region is closest to your clients

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1        # keep at least one machine warm -- avoids a cold-start OCR request
  processes = ["app"]

[[vm]]
  memory = "1gb"                  # OCR (rasterizing + Tesseract) is memory-hungrier than a typical small web app
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "treasury_ledger_data"  # the persistent volume created in DEPLOY.md step 3
  destination = "/data"            # matches TREASURY_LEDGER_DB=/data/treasury_ledger.db in the Dockerfile
